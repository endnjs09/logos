id: logos.guard.secret-scan
kind: guard
name: secret-scan
description: Detects concrete secret-like values before they are executed, written, logged, or summarized.
status: active
version: 0.2.0
enforcement: hard
enforcement_status: implemented
decision: allow_block_ask
risk_level: high
severity: 3
targets: [codex-cli]
surfaces: [pre_tool_use, post_tool_use, runner_record_stage, verification]
inputs:
  - hook_event.command
  - tool_result.output
  - changed_file_content
  - evidence_payload
outputs:
  - guard-result
  - sanitized-evidence
schemas:
  - schemas/guard-result.schema.json
runtime_modules:
  - logos_core.guards.secret_scan
  - targets/codex-cli/templates/codex/hooks/pre_tool_use.py.template
  - targets/codex-cli/templates/codex/hooks/post_tool_use.py.template
detail_reference: core/guards/references/secret-scan-details.md
policy:
  allow_when:
    - Text contains placeholder names, environment variable names, or documentation-only key labels.
    - Secret-like value is already redacted.
  ask_when:
    - Text may contain a credential but context is unclear.
  block_when:
    - Concrete credential, private key, token, cookie, or connection secret would be printed, committed, or stored.
  sanitize_when:
    - Evidence or run logs need to preserve surrounding context without retaining the secret value.
